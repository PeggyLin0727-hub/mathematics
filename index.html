<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國中數學互動學習遊戲總入口 - Mathematics Games Portal</title>
    <link rel="stylesheet" href="mathematics.css">
    <style>
        .portal-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }

        .category-group {
            width: 100%;
        }

        .category-title {
            color: #4A90E2;
            font-size: 1.3rem;
            margin-bottom: 12px;
            border-bottom: 2px solid #2C3E50;
            padding-bottom: 5px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 15px;
        }

        .nav-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-sizing: border-box;
        }

        .nav-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.4);
        }

        .nav-info {
            text-align: left;
        }

        .nav-info h3 {
            font-size: 1.2rem;
            color: #2C3E50;
            margin-bottom: 4px;
        }

        .nav-info .en-sub {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 8px;
            display: block;
        }

        .nav-info p {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .nav-arrow {
            font-size: 1.3rem;
            color: #4A90E2;
            font-weight: bold;
            margin-left: 15px;
            white-space: nowrap;
        }

        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="portal-container">
        <div style="text-align: center; color: #ffffff; margin-bottom: 10px;">
            <h1 style="color: #ffffff; font-size: 2.2rem; margin-bottom: 8px;">📐 國中數學互動學習館</h1>
        </div>

        <!-- 動態渲染各單元入口列表 -->
        <div id="portal-content" style="width: 100%;"></div>
    </div>

    <script>
        // 自動載入 topics.json 動態渲染單元列表
        fetch('topics.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('portal-content');
                let htmlContent = '';

                data.forEach(group => {
                    htmlContent += `
                        <div class="category-group">
                            <h2 class="category-title">${group.category}</h2>
                            <div class="grid-container">
                    `;

                    group.topics.forEach(topic => {
                        htmlContent += `
                            <a href="./${topic.folder}/index.html" class="nav-card">
                                <div class="nav-info">
                                    <h3>${topic.title}</h3>
                                    <span class="en-sub hidden">${topic.enTitle}</span>
                                    <p>${topic.desc}</p>
                                </div>
                                <div class="nav-arrow">進入 ➔</div>
                            </a>
                        `;
                    });

                    htmlContent += `
                            </div>
                        </div>
                        <br>
                    `;
                });

                container.innerHTML = htmlContent;
            })
            .catch(error => {
                console.error('無載入 JSON 設定檔：', error);
            });
    </script>
</body>
</html>
